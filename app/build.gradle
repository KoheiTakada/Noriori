plugins {
    id 'com.android.application'
}

android {
    buildToolsVersion '35.0.0'
    namespace 'jp.kohei.norisugoshi'
    compileSdk 36

    defaultConfig {
        applicationId 'jp.kohei.norisugoshi.guard'
        minSdk 29
        targetSdk 35
        versionCode 27
        versionName '0.9.12'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    signingConfigs {
        debug {
            if (project.hasProperty('debugKeystorePath')) {
                storeFile file(project.property('debugKeystorePath'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    // Release builds are signed with the same persistent keystore as previous installed APKs.
    // Never commit this keystore to the repository.
    signingConfigs {
        release {
            def keystore = System.getenv('NORIORI_RELEASE_KEYSTORE_PATH')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('NORIORI_RELEASE_STORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('NORIORI_RELEASE_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('NORIORI_RELEASE_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('NORIORI_RELEASE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { buildConfig = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}

tasks.withType(Test).configureEach {
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.net=ALL-UNNAMED',
            '--add-opens=java.base/java.security=ALL-UNNAMED',
            '--add-opens=java.base/java.text=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
            '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
            '--enable-native-access=ALL-UNNAMED'
    ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort'].each { name ->
        if (System.getProperty(name) != null) {
            systemProperty name, System.getProperty(name)
        }
    }
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    systemProperty 'norisugoshi.map.offlineTest', 'true'
}

name: Publish signed Noriori APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noriori-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and Android lint
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Restore persistent APK signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.NORIORI_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing NORIORI_SIGNING_KEYSTORE_BASE64. Upload the existing fixed-signature keystore as a GitHub Actions repository secret."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noriori.keystore"
          chmod 600 "$RUNNER_TEMP/noriori.keystore"

      - name: Assemble signed release APK
        env:
          NORIORI_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/noriori.keystore
          NORIORI_RELEASE_STORE_PASSWORD: ${{ secrets.NORIORI_SIGNING_STORE_PASSWORD }}
          NORIORI_RELEASE_KEY_ALIAS: ${{ secrets.NORIORI_SIGNING_KEY_ALIAS }}
          NORIORI_RELEASE_KEY_PASSWORD: ${{ secrets.NORIORI_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signing
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          CERT_SHA256=$(awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ {print toupper($2)}' "$RUNNER_TEMP/apk-signature.txt")
          EXPECTED_CERT_SHA256="0D680E2FB1C65BA2B037FE26F94306F7355D7C16512AE518FCCF9B859248DB0D"
          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK certificate mismatch. Use the signing keystore already used by Noriori v0.9.11."
            exit 1
          fi
          sha256sum "$APK"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E "^[[:space:]]*versionName '" app/build.gradle | head -1 | cut -d "'" -f2)
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing new to publish. Increase versionCode and versionName for the next update."
            exit 0
          fi
          gh release create "$TAG" "app/build/outputs/apk/release/app-release.apk#Noriori-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "Noriori $TAG" \
            --generate-notes
